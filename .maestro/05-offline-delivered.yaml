# Part two: the app was killed while the message was still waiting, and the
# network is back. Opening the conversation has to deliver it.
#
# This is the journey for the bug that started the whole reliability effort: a
# message typed on a train, an app closed at the station, and nothing left when
# the phone found signal again.
appId: de.beko2210.binder
name: Offline — the waiting message is delivered after a restart
---
- launchApp
- runFlow:
    when:
      visible: 'du@beispiel.de'
    commands:
      - tapOn: 'du@beispiel.de'
      - inputText: ${MAESTRO_EMAIL}
      - hideKeyboard
      - tapOn: 'Mindestens 8 Zeichen'
      - inputText: ${MAESTRO_PASSWORD}
      - hideKeyboard
      - tapOn: 'Anmelden'
- runFlow:
    when:
      visible: 'Bei Nutzung der App'
    commands:
      - tapOn: 'Bei Nutzung der App'
- tapOn: 'Binds'
- tapOn:
    text: 'Unterhaltung mit .*'
    index: 0
- extendedWaitUntil:
    visible: ${MAESTRO_OFFLINE_TEXT}
    timeout: 30000
- extendedWaitUntil:
    visible: '.*Gesendet.*'
    timeout: 60000
