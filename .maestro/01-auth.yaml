# Signing in and out, and the deck actually arriving.
#
# A login that "works" but leaves an empty deck behind is the failure people
# report as "the app is broken", so the journey ends on a card, not on a
# navigation bar.
appId: de.beko2210.binder
name: Auth — sign in, see the deck, sign out
---
- clearState
- launchApp
- assertVisible: 'Willkommen zurück.'

- tapOn: 'du@beispiel.de'
- inputText: ${MAESTRO_EMAIL}
- hideKeyboard
- tapOn: 'Mindestens 8 Zeichen'
- inputText: ${MAESTRO_PASSWORD}
- hideKeyboard
- tapOn: 'Anmelden'
- runFlow:
    when:
      visible: 'Never for this app or website'
    commands:
      # Samsung Pass fragt nach dem ersten Passwort. Der Dialog liegt ueber der
      # App: ohne dieses Wegtippen landet jeder folgende Griff im Systemfenster.
      - tapOn: 'Never for this app or website'


# The location prompt belongs to Android, not to us; it may or may not appear.
- runFlow:
    when:
      visible: 'Bei Nutzung der App'
    commands:
      - tapOn: 'Bei Nutzung der App'

- extendedWaitUntil:
    visible: 'Entdecken'
    timeout: 30000
- assertVisible: 'Deine Suche'
- takeScreenshot: shots/nach-anmeldung

- tapOn: 'Menü'
- takeScreenshot: shots/menue
- scrollUntilVisible:
    element: 'Abmelden'
    direction: DOWN
- tapOn: 'Abmelden'
- tapOn: 'ABMELDEN'
- extendedWaitUntil:
    visible: 'Willkommen zurück.'
    timeout: 20000
