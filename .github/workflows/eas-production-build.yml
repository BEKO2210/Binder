name: Binder EAS Production Build
# Repository secret contract: EXPO_TOKEN.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binder-eas-production
  cancel-in-progress: false

jobs:
  android-production:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      CI: '1'
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.13.1'
          package-manager-cache: false

      - name: Require Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN repository secret is missing or empty." >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Materialize production branding
        run: npm run brand:assets

      # The same list CI runs. There used to be a shorter one here, and the
      # shorter one was what stood between a mistake and the Play Store.
      - name: Quality gate
        run: node scripts/quality-gate.mjs

      - name: Build Android production bundle on EAS
        # Pinned: a production build may not depend on what was published to
        # npm this morning. Raising this is a decision, visible in a diff.
        run: npx --yes eas-cli@16.19.3 build --platform android --profile production --non-interactive
