name: Binder CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

permissions:
  contents: read

jobs:
  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.13.1'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Materialize Binder brand assets
        run: npm run brand:assets

      - name: Prepare public site assets
        run: npm run site:prepare

      - name: Audit production dependency graph
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node scripts/verify-audit-baseline.mjs npm-audit.json

      - name: Quality gate (the same list a release runs)
        run: node scripts/quality-gate.mjs

      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: v2.x
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/**/deno.json') }}

      - name: Typecheck Edge Functions
        run: |
          deno check --config supabase/functions/delete-account/deno.json supabase/functions/delete-account/index.ts
          deno check --config supabase/functions/dispatch-push/deno.json supabase/functions/dispatch-push/index.ts
          deno check --config supabase/functions/invite-moderator/deno.json supabase/functions/invite-moderator/index.ts

      - name: Verify Android native config
        run: npx expo prebuild --platform android --no-install --clean

      - name: Android Expo bundle
        run: npm run bundlecheck

      - name: Report Android export size
        run: node scripts/report-bundle-size.mjs
