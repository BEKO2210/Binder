name: Binder CI

on:
  push:
    branches: [main, 'phase/**']
  pull_request:

permissions:
  contents: read

jobs:
  app-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          package-manager-cache: false

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Materialize Binder brand assets
        run: npm run brand:assets

      - name: Prepare public site assets
        run: npm run site:prepare

      - name: Audit production dependency graph
        run: |
          npm audit --omit=dev --json > npm-audit.json || true
          node scripts/verify-audit-baseline.mjs npm-audit.json

      - name: Verify app entrypoint
        run: node scripts/verify-entrypoint.mjs

      - name: Verify native Binder branding
        run: npm run verify:brand

      - name: Verify public policy site
        run: node scripts/verify-site.mjs

      - name: Verify admin dashboard authorization boundary
        run: npm run verify:admin

      - name: Verify Phase 4 safety contract
        run: node scripts/verify-safety-contract.mjs

      - name: Verify Phase 5 beta contract
        run: node scripts/verify-phase5-contract.mjs

      - name: Verify Phase 6 visual system
        run: npm run verify:phase6-design

      - name: Verify Phase 6 settings
        run: npm run verify:phase6-settings

      - name: Verify Phase 6 media path
        run: npm run verify:phase6-media

      - name: Verify Phase 7 push and communication reliability
        run: npm run verify:phase7-push

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
          cache-hash: ${{ hashFiles('supabase/functions/**/deno.json') }}

      - name: Typecheck Edge Functions
        run: |
          deno check --config supabase/functions/delete-account/deno.json supabase/functions/delete-account/index.ts
          deno check --config supabase/functions/dispatch-push/deno.json supabase/functions/dispatch-push/index.ts
          deno check --config supabase/functions/invite-moderator/deno.json supabase/functions/invite-moderator/index.ts

      - name: TypeScript
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Verify Android native config
        run: npx expo prebuild --platform android --no-install --clean

      - name: Android Expo bundle
        run: npm run bundlecheck

      - name: Report Android export size
        run: node scripts/report-bundle-size.mjs
