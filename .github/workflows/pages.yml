name: Binder Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/brand/**'
      - 'assets/brand-src/**'
      - 'scripts/materialize-brand-assets.mjs'
      - 'scripts/prepare-site.mjs'
      - 'scripts/verify-site.mjs'
      - 'scripts/build-site-languages.mjs'
      - 'src/i18n/locales/**'
      - 'scripts/verify-admin-dashboard.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.13.1'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify site language page matches bundled locales
        run: npm run verify:site-languages

      - name: Prepare Binder site assets
        run: npm run site:prepare
      - name: Verify public policy and brand contract
        run: node scripts/verify-site.mjs
      - name: Verify admin dashboard authorization boundary
        run: npm run verify:admin
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
