name: Binder Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'assets/brand/**'
      - 'assets/brand-src/**'
      - 'scripts/materialize-brand-assets.mjs'
      - 'scripts/prepare-site.mjs'
      - 'scripts/verify-site.mjs'
      - 'scripts/verify-admin-dashboard.mjs'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Prepare Binder site assets
        run: npm run site:prepare
      - name: Verify public policy and brand contract
        run: node scripts/verify-site.mjs
      - name: Verify admin dashboard authorization boundary
        run: npm run verify:admin
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
