# Code scanning and dependency review.
#
# The repository's own gates check the promises this project makes. These two
# check the things nobody on the project would think to look for: patterns a
# static analyser knows are dangerous, and a dependency that became vulnerable
# after it was chosen.
name: Binder Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Once a week: an advisory published after a merge is still an advisory.
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze
        uses: github/codeql-action/analyze@f3712979fa5f215279b101dd0a2e3bdfb4353324 # v3

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Review dependency changes
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high

  secrets:
    name: Credential scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.13.1'

      - name: Scan tracked files
        run: node scripts/verify-no-secrets.mjs

      # The self-tests parse the app with the TypeScript compiler, so they need
      # the dependencies installed.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Prove the guards still catch planted defects
        run: node scripts/verify-gate-selftests.mjs
