# Drop a language file in, get a site out.
#
# Adding a language should be one file and nothing else. This watches the two
# folders the site is built from and regenerates the pages whenever either
# changes — the language files and the templates. The commit it pushes touches
# only generated pages, and the Pages workflow picks it up from there.
#
# It never runs on its own output: the paths filter excludes the generated
# pages, and the commit is skipped when nothing changed.
name: Binder Site Languages

on:
  push:
    branches: [main]
    paths:
      - 'site/i18n/**'
      - 'site/templates/**'
      - 'scripts/build-site-i18n.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-i18n
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # A pushed commit has to carry the token that may push again.
          persist-credentials: true

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22.13.1'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # The brand assets are generated, not committed, and verify-site insists
      # on them being there.
      - name: Prepare Binder site assets
        run: npm run site:prepare

      - name: Build the site from its language files
        run: node scripts/build-site-i18n.mjs

      - name: Check the result against the site contract
        run: |
          node scripts/verify-site.mjs
          node scripts/build-site-languages.mjs --check
          node scripts/verify-site-language-switch.mjs

      - name: Commit the regenerated pages
        run: |
          if git diff --quiet -- site/; then
            echo "Nothing changed — the pages already match the language files."
            exit 0
          fi
          git config user.name "binder-site-bot"
          git config user.email "noreply@github.com"
          git add site/*.html site/de site/sitemap.xml site/i18n site/templates
          LANGS=$(ls site/i18n/*.json | grep -v context | xargs -n1 basename | sed 's/.json//' | paste -sd', ')
          git commit -m "The site is rebuilt from its language files ($LANGS)

          Generated by .github/workflows/site-i18n.yml after a change to
          site/i18n or site/templates. No copy was written here by hand."
          git push
