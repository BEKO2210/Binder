name: Binder Database Tests

on:
  push:
    branches: [main, 'phase/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.114.0
      - name: Initialize local Supabase config
        run: supabase init --force
      - name: Start local Postgres
        run: supabase db start
      - name: Run pgTAP database tests
        run: supabase test db

      # The argument that the internal helpers are safe rests on PostgREST not
      # serving their schema. That is configuration, not law, so it is asked
      # over HTTP rather than assumed.
      - name: Check what the API actually exposes
        run: |
          # `db start` brings up Postgres alone, and a later `start` reports
          # "already running" while Kong, PostgREST and Auth stay down — which
          # is why this asked an API that was not there.
          supabase stop --no-backup >/dev/null 2>&1 || true
          supabase start >/dev/null
          node scripts/verify-api-surface.mjs
      - name: Stress atomic mutual matches
        run: bash supabase/tests/phase2_concurrency.sh
      - name: Stress conversation races
        run: bash supabase/tests/phase3_concurrency.sh
      - name: Stress sender-wide rate limit
        run: bash supabase/tests/phase3_rate_concurrency.sh
      - name: Stress six-photo gallery races
        run: bash supabase/tests/phase6_media_concurrency.sh
      - name: Stress push dispatcher claims
        run: bash supabase/tests/phase7_push_concurrency.sh
      - name: Lint Binder schemas
        run: supabase db lint --schema public,private --level error --fail-on error

  account-deletion-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Supabase CLI
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3
        with:
          version: 2.114.0
      - name: Initialize local Supabase config
        run: supabase init --force
      - name: Exercise Auth + Storage + Edge deletion end-to-end
        run: bash supabase/tests/phase4_delete_account_integration.sh
