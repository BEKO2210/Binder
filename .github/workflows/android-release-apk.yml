name: Binder Android Release APK

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-release-apk.yml'
      - 'src/**'
      - 'App.tsx'
      - 'index.ts'
      - 'app.json'
      - 'package.json'
      - 'tsconfig.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPO_PUBLIC_SUPABASE_URL: https://sbohsxtzitqhyswznhec.supabase.co
      EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_CS84Z2jb7tQZBk97sFpPCw_9smErm5J
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22.13.1'
          package-manager-cache: false

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Verify TypeScript
        run: npm run typecheck

      - name: Generate Android project
        run: npx expo prebuild --platform android --no-install --clean

      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Verify APK and embedded JS bundle
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          unzip -l "$APK" | grep -q 'assets/index.android.bundle'
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload standalone Binder APK
        uses: actions/upload-artifact@v4
        with:
          name: binder-android-0.5.0-standalone
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 7
